name: build_parser
on: [push, workflow_dispatch]
jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/cache@v3
        with:
          path: target/release/baseball-computer
          key: build-${{ github.run_id }}

      - run: cargo build --release
      - run: cargo test --release
      - run: cargo fmt --all -- --check
      # clippy::all + clippy::cargo are deny-level via main.rs lint attrs,
      # so any new error fails the build automatically.
      - run: cargo clippy --all-targets --release

  retrosheet:
    name: retrosheet
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v3

      - id: key
        run: echo "key=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v3
        id: cache
        with:
          path: retrosheet/
          key: retrosheet-${{ steps.key.outputs.key }}

      - uses: astral-sh/setup-uv@v3
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - if: steps.cache.outputs.cache-hit != 'true'
        run: uv sync --extra ci --frozen
      - if: steps.cache.outputs.cache-hit != 'true'
        run: uv run python bin/fetch_retrosheet.py -o retrosheet
      - if: steps.cache.outputs.cache-hit != 'true'
        run: uv run python bin/patch_known_corpus_bugs.py retrosheet

  simple_files:
    name: Parse simple files
    needs: [retrosheet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/cache@v3
        with:
          path: retrosheet/
          key: retrosheet-${{ needs.retrosheet.outputs.key }}

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --extra ci --frozen
      - run: uv run python bin/simple_files.py
      - run: uv run python bin/biodata.py

      - run: |
          uv run aws s3 sync --endpoint-url="$R2_ENDPOINT" \
            retrosheet_simple s3://timeball/misc \
            --exclude '*' --include '*.parquet' --delete
          uv run aws s3 sync --endpoint-url="$R2_ENDPOINT" \
            biodata s3://timeball/biodata \
            --exclude '*' --include '*.parquet' --delete

      # TODO: Add back after databank is restored
      # uv run aws s3 sync --endpoint-url="$R2_ENDPOINT" \
      # baseballdatabank s3://timeball/baseballdatabank \
      # --exclude '*' --include '*.parquet' --delete #}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          # R2 rejects default `x-amz-checksum-*` headers added by botocore
          # >=1.36, returning 401 Unauthorized.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

  pbp:
    name: Create play-by-play
    needs: [build, retrosheet]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - uses: actions/cache@v3
        with:
          path: retrosheet/
          key: retrosheet-${{ needs.retrosheet.outputs.key }}

      - uses: actions/cache@v3
        with:
          path: target/release/baseball-computer
          key: build-${{ github.run_id }}
      - run: mkdir csv parquet arrow
      - run: ./target/release/baseball-computer -i retrosheet -o csv

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --extra ci --frozen
      - run: uv run python bin/parquet.py

      - run: |
          uv run aws s3 sync --endpoint-url=${{ secrets.R2_ENDPOINT }} \
            parquet s3://timeball/event \
            --exclude '*' --include '*.parquet' --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

  purge_cache:
    name: Purge Cloudflare cache
    needs: [pbp, simple_files]
    runs-on: ubuntu-22.04
    steps:
      # baseball.computer
      - run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.PURGE_CACHE_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything": true}'
