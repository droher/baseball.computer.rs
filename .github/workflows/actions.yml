name: build_parser
on:
  push:
  workflow_dispatch:
    inputs:
      revision:
        description: Corpus revision tag on droher/retrosheet-mirror, such as 2026.08-c2 (defaults to CORPUS_REVISION)
        required: false
        default: ""
      publish:
        description: Publish the outputs to R2 and purge the Cloudflare cache
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: target/release/baseball-computer
          key: build-${{ github.run_id }}

      - run: cargo build --release
      - run: cargo test --release
      - run: cargo fmt --all -- --check
      # clippy::all + clippy::cargo are deny-level via main.rs lint attrs,
      # so any new error fails the build automatically.
      - run: cargo clippy --all-targets --release

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv run --frozen --group dev python -m pytest -q bin

  revision:
    name: Resolve the Corpus revision
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: resolve
        run: |
          revision="${INPUT_REVISION:-$(tr -d '[:space:]' < CORPUS_REVISION)}"
          if ! [[ "$revision" =~ ^[0-9]{4}\.[0-9]{2}-c[0-9]+$ ]]; then
            echo "::error::'$revision' is not a Corpus revision (YYYY.MM-cN)"
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
        env:
          INPUT_REVISION: ${{ inputs.revision }}

  corpus:
    name: Build the Corpus revision
    needs: revision
    runs-on: ubuntu-latest
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: corpus
          key: corpus-${{ needs.revision.outputs.revision }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: droher/retrosheet-mirror
          ref: refs/tags/${{ needs.revision.outputs.revision }}
          token: ${{ secrets.MIRROR_TOKEN }}
          path: mirror
          fetch-depth: 1
          persist-credentials: false
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - if: steps.cache.outputs.cache-hit != 'true'
        run: >
          uv run --project mirror --frozen mirror --root mirror
          materialize --revision "$REVISION" --out corpus
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          REVISION: ${{ needs.revision.outputs.revision }}

  simple_files:
    name: Parse simple files
    needs: [python, revision, corpus]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache/restore@v4
        with:
          path: corpus
          key: corpus-${{ needs.revision.outputs.revision }}
          fail-on-cache-miss: true

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --extra ci --frozen
      - run: uv run python bin/corpus_coverage.py --corpus corpus
      - run: uv run python bin/simple_files.py --corpus corpus
      - run: uv run python bin/biodata.py --corpus corpus

      - if: inputs.publish && github.ref == 'refs/heads/master'
        run: |
          uv run aws s3 sync --endpoint-url="$R2_ENDPOINT" \
            retrosheet_simple s3://timeball/misc \
            --exclude '*' --include '*.parquet' --delete
          uv run aws s3 sync --endpoint-url="$R2_ENDPOINT" \
            biodata s3://timeball/biodata \
            --exclude '*' --include '*.parquet' --delete
          uv run aws s3 sync --endpoint-url="$R2_ENDPOINT" \
            baseballdatabank s3://timeball/baseballdatabank \
            --exclude '*' --include '*.parquet' --delete
          uv run aws s3 sync --endpoint-url="$R2_ENDPOINT" \
            ngl_stats s3://timeball/ngl_stats \
            --exclude '*' --include '*.parquet' --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

  pbp:
    name: Create play-by-play
    needs: [build, revision, corpus]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache/restore@v4
        with:
          path: corpus
          key: corpus-${{ needs.revision.outputs.revision }}
          fail-on-cache-miss: true

      - uses: actions/cache@v4
        with:
          path: target/release/baseball-computer
          key: build-${{ github.run_id }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --extra ci --frozen
      - run: mkdir csv parquet
      - run: ./target/release/baseball-computer -i corpus/retrosheet -o csv
      - run: uv run python bin/parquet.py

      - uses: actions/upload-artifact@v4
        with:
          name: findings-${{ needs.revision.outputs.revision }}
          path: csv/findings.csv

      - if: inputs.publish && github.ref == 'refs/heads/master'
        run: |
          uv run aws s3 sync --endpoint-url="$R2_ENDPOINT" \
            parquet s3://timeball/event \
            --exclude '*' --include '*.parquet' --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

  purge_cache:
    name: Purge Cloudflare cache
    if: inputs.publish && github.ref == 'refs/heads/master'
    needs: [pbp, simple_files]
    runs-on: ubuntu-22.04
    steps:
      # baseball.computer
      - run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.PURGE_CACHE_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything": true}'
