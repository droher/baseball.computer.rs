[project]
name = "baseball-computer-bin"
version = "0.0.0"
description = "Helper scripts that consume the baseball-computer Rust parser's CSV output and publish Parquet downstream."
requires-python = ">=3.10"
dependencies = [
    "pyarrow==14.0.1",
    "SQLAlchemy==1.4.46",
    "boxball-schemas==0.0.8",
    "pandas==2.1.1",
    # pyarrow 14.0.1 was built against numpy 1.x; modern resolvers will
    # otherwise pull numpy 2.x which fails at import.
    "numpy<2",
]

[project.optional-dependencies]
ci = [
    # botocore >=1.36 added default integrity protections that R2 rejects
    # with 401 Unauthorized. awscli 1.35.x pins botocore<1.36.
    "awscli>=1.34,<1.36",
    # awscli's lower bound on PyYAML resolves to 5.4.1 whose sdist no longer
    # builds on Cython 3+. Force a wheel-available release.
    "pyyaml>=6.0.1",
]

[tool.uv]
package = false
