[package]
name = "retrosheet-grammar"
version = "0.0.0"
authors = ["David Roher <david.roher@gmail.com>"]
edition = "2024"
rust-version = "1.94"
description = "Pest grammar for Retrosheet event files. Canonical executable spec."
license = "BSL-1.0"
repository = "https://github.com/droher/baseball.computer.rs"
publish = false

[dependencies]
pest = "2.7"
pest_derive = "2.7"

[[bin]]
name = "crosscheck-plays"
path = "src/bin/crosscheck.rs"

[[bin]]
name = "crosscheck-files"
path = "src/bin/crosscheck_files.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
