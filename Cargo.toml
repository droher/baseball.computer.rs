[package]
name = "baseball-computer"
version = "0.0.1"
authors = ["David Roher <david.roher@gmail.com>"]
edition = "2024"
rust-version = "1.94"
description = "Creates structured datasets from raw Retrosheet files."
license = "BSL-1.0"
repository = "https://github.com/droher/baseball.computer.rs"
readme = "README.md"
keywords = ["retrosheet", "baseball"]
categories = ["command-line-utilities", "science"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["std", "clock", "serde"]}
strum = "0.28.0"
strum_macros = "0.28.0"
csv = "1.4.0"
anyhow = "1.0.102"
num-traits = "0.2.19"
arrayref = "0.3.9"
arrayvec = {version = "0.7.6", features = ["serde"]}
const_format = "0.2.36"
either = {version = "1.15.0", features = ["serde", "use_std"]}
num_enum = "0.7.6"
bimap = "0.6.3"
clap = {version = "4.6.1", features = ["derive"]}
itertools = "0.14.0"
serde = {version = "1.0.228",  features = ["derive", "rc"]}
serde_json = {version = "1.0.149", features = ["preserve_order"]}
glob = "0.3.3"
rayon = "1.12.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
bounded-integer = {version = "0.5.8", features = ["types", "serde"]}
serde_repr = "0.1.20"
regex = {version = "1.12.3", default-features = false, features = ["std", "perf"]} # No need for unicode
quick_cache = {version = "0.6.21", features = ["stats"]}
fixed-map = {version = "0.9.5", features = ["serde"]}
lazy-regex = "3.6.0"
flate2 = "1.1.9"
papaya = "0.2.4"
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3.27"

[workspace]
members = ["crates/retrosheet-grammar"]
resolver = "3"

# Release-equivalent profile that keeps debug line tables so samply / Instruments
# flamegraphs resolve to real source lines. Strip is off; binary is bigger.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
split-debuginfo = "unpacked"
